<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FS25 Mod Inventory</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e0a63a'/%3E%3Cpath d='M10 9h12M10 15h12M10 21h7' stroke='%231a1204' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: dark;
  --bg: #111315;
  --rail: #16181b;
  --surface: #1b1e21;
  --surface-2: #22262a;
  --surface-3: #2a2f34;
  --line: #2c3136;
  --line-soft: #23272b;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #8a8d88;
  --accent: #e0a63a;
  --accent-soft: rgba(224, 166, 58, 0.14);
  --accent-ink: #1a1204;
  --critical: #d03b3b;
  --warning: #fab219;
  --good: #0ca30c;
  --s-used: #3987e5;
  --s-dep: #d95926;
  --s-indirect: #199e70;
  --s-script: #c98500;
  --s-unused: #d55181;
  --s-other: #5f625d;
  --radius: 14px;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --font-display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --mono: "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.45;
  display: grid;
  grid-template-columns: 300px 1fr;
  overflow: hidden;
}
button { font: inherit; color: inherit; }
::selection { background: var(--accent); color: var(--accent-ink); }
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 8px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

.rail {
  background: var(--rail);
  border-right: 1px solid var(--line-soft);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 22px 20px 18px;
}
.brand-mark {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(145deg, #f0bd57, #c98a1f);
  display: grid; place-items: center;
  box-shadow: 0 6px 18px rgba(224, 166, 58, 0.25), inset 0 1px 0 rgba(255,255,255,0.3);
}
.brand h1 { font-family: var(--font-display); font-size: 17px; font-weight: 650; margin: 0; letter-spacing: 0.2px; }
.brand p { margin: 0; font-size: 12px; color: var(--muted); }
.rail-label { padding: 6px 20px 8px; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.sg-list { overflow-y: auto; padding: 0 12px 16px; display: flex; flex-direction: column; gap: 6px; }
.rail-foot { margin-top: auto; padding: 14px 16px 16px; }
.upd-box { background: var(--accent-soft); border: 1px solid rgba(224,166,58,0.35); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; }
.upd-box b { font-size: 13px; }
.upd-box span { font-size: 12.5px; color: var(--ink-2); }
.rail-foot[hidden] { display: none; }
.sg {
  display: grid;
  grid-template-columns: 52px 1fr;
  gap: 12px;
  align-items: center;
  padding: 10px;
  border-radius: 12px;
  border: 1px solid transparent;
  background: transparent;
  cursor: pointer;
  text-align: left;
  transition: background 0.15s, border-color 0.15s;
}
.sg:hover { background: var(--surface); }
.sg.active { background: var(--surface-2); border-color: rgba(224, 166, 58, 0.55); box-shadow: inset 3px 0 0 var(--accent); }
.sg-thumb { width: 52px; height: 52px; border-radius: 10px; overflow: hidden; background: var(--surface-3); position: relative; }
.sg-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sg-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sg-map { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sg-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; display: flex; gap: 8px; }

.main { overflow-y: auto; min-height: 0; position: relative; scroll-behavior: smooth; }

.hero {
  position: relative;
  overflow: hidden;
  padding: 40px 44px 30px;
  min-height: 250px;
  border-bottom: 1px solid var(--line-soft);
}
.hero-bg { position: absolute; inset: 0; z-index: 0; }
.hero-bg img {
  position: absolute; inset: -60px;
  width: calc(100% + 120px); height: calc(100% + 120px);
  object-fit: cover;
  filter: blur(34px) saturate(1.25) brightness(0.62);
  transform: scale(1.06);
  opacity: 0;
  transition: opacity 0.6s;
}
.hero-bg img.loaded { opacity: 1; }
.hero-bg::after {
  content: "";
  position: absolute; inset: 0;
  background:
    radial-gradient(1200px 400px at 0% 0%, rgba(17,19,21,0.15), rgba(17,19,21,0.65)),
    linear-gradient(180deg, rgba(17,19,21,0.25) 0%, rgba(17,19,21,0.92) 100%);
}
.hero-inner { position: relative; z-index: 1; display: grid; grid-template-columns: auto 1fr auto; gap: 28px; align-items: end; }
.hero-cover {
  width: 132px; height: 132px; border-radius: 18px; overflow: hidden;
  box-shadow: 0 18px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);
  background: var(--surface-3);
}
.hero-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.eyebrow { font-size: 12px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--accent); font-weight: 650; }
.hero h2 { font-family: var(--font-display); font-size: 38px; line-height: 1.1; font-weight: 700; margin: 6px 0 10px; letter-spacing: -0.4px; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 11px; border-radius: 999px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.08);
  font-size: 12.5px; color: var(--ink-2);
}
.pill svg { opacity: 0.8; }
.hero-stat { text-align: right; padding-bottom: 4px; }
.hero-stat .num { font-family: var(--font-display); font-size: 64px; font-weight: 700; line-height: 1; letter-spacing: -1.5px; font-variant-numeric: tabular-nums; }
.hero-stat .lbl { font-size: 14px; color: var(--ink-2); margin-top: 4px; }
.hero-stat .sub { font-size: 13px; color: var(--accent); margin-top: 2px; font-weight: 600; }

.compo { position: relative; z-index: 1; margin-top: 28px; }
.compo-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.compo-head span { font-size: 13px; color: var(--ink-2); }
.bar { display: flex; gap: 2px; height: 14px; }
.seg {
  height: 100%;
  min-width: 6px;
  border-radius: 2px;
  transform-origin: left;
  animation: grow 0.7s cubic-bezier(.2,.8,.2,1) both;
  cursor: pointer;
  position: relative;
}
.seg:first-child { border-radius: 4px 2px 2px 4px; }
.seg:last-child { border-radius: 2px 4px 4px 2px; }
.seg:only-child { border-radius: 4px; }
.seg:hover { filter: brightness(1.18); }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; }
.legend button {
  background: none; border: 0; padding: 0; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2);
}
.legend button:hover { color: var(--ink); }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; }
.legend b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

.tooltip {
  position: fixed; pointer-events: none; z-index: 50;
  background: #0b0c0d; border: 1px solid var(--line);
  padding: 8px 11px; border-radius: 9px; font-size: 12.5px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  opacity: 0; transition: opacity 0.12s;
}
.tooltip.show { opacity: 1; }
.tooltip .t { font-weight: 600; display: flex; align-items: center; gap: 7px; }
.tooltip .d { color: var(--ink-2); margin-top: 2px; }

.content { padding: 22px 44px 140px; }
.alert {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 14px 16px; border-radius: 12px; margin-bottom: 18px;
  background: rgba(208, 59, 59, 0.1); border: 1px solid rgba(208, 59, 59, 0.45);
}
.alert.warn { background: rgba(250, 178, 25, 0.08); border-color: rgba(250, 178, 25, 0.4); }
.alert.info { background: rgba(57, 135, 229, 0.08); border-color: rgba(57, 135, 229, 0.4); }
.sg.other { opacity: 0.45; }
.sg.other:hover, .sg.other.active { opacity: 0.85; }
.sg-other { color: #8fb8ea; }
.alert svg { flex-shrink: 0; }
.alert strong { display: block; margin-bottom: 2px; }
.alert ul { margin: 6px 0 0; padding-left: 18px; color: var(--ink-2); }

.toolbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 12px 44px; margin: 0;
  background: rgba(17,19,21,0.82);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line-soft);
}
.chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
.chip {
  border: 1px solid var(--line); background: var(--surface);
  padding: 6px 12px; border-radius: 999px; cursor: pointer;
  font-size: 13px; color: var(--ink-2);
  display: inline-flex; align-items: center; gap: 7px;
  transition: all 0.15s;
}
.chip:hover { border-color: #3c434a; color: var(--ink); }
.chip.on { background: var(--ink); color: #111; border-color: var(--ink); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }
.chip .n { font-variant-numeric: tabular-nums; opacity: 0.75; }
.search {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 0 12px; height: 36px; width: 260px;
}
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search input { background: none; border: 0; outline: 0; color: var(--ink); font: inherit; width: 100%; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  border-radius: 10px; padding: 0 14px; height: 36px;
  border: 1px solid var(--line); background: var(--surface);
  cursor: pointer; font-weight: 600; font-size: 13px;
  transition: all 0.15s;
}
.btn:hover { background: var(--surface-2); border-color: #3c434a; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { background: #ebb34a; }
.btn.primary:disabled { background: var(--surface-3); color: var(--muted); border-color: var(--surface-3); cursor: not-allowed; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { color: var(--ink); background: var(--surface); }
.btn .badge { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 7px; font-size: 11px; line-height: 18px; }

.group { margin-top: 30px; }
.group-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
.group-title { display: flex; align-items: center; gap: 10px; }
.group-title .sw { width: 12px; height: 12px; border-radius: 4px; }
.group-title h3 { font-family: var(--font-display); font-size: 20px; margin: 0; font-weight: 650; }
.group-title .count { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.group-desc { color: var(--ink-2); font-size: 13px; margin: 4px 0 0 22px; max-width: 760px; }
.group-actions { display: flex; gap: 6px; flex-shrink: 0; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.card {
  position: relative;
  display: grid; grid-template-columns: 60px 1fr; gap: 14px;
  padding: 14px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--line-soft);
  transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
  animation: rise 0.35s ease both;
}
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.card.pick { cursor: pointer; }
.card.pick:hover { border-color: #3c434a; background: #1f2226; }
.card.sel { border-color: var(--accent); background: linear-gradient(180deg, rgba(224,166,58,0.09), rgba(224,166,58,0.03)); box-shadow: 0 0 0 1px var(--accent) inset; }
.card .stripe { position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; }
.ico {
  width: 60px; height: 60px; border-radius: 12px; overflow: hidden;
  background: var(--surface-3); display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--ink-2);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.05);
  flex-shrink: 0;
}
.ico img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-body { min-width: 0; }
.card-title { font-weight: 600; font-size: 14.5px; line-height: 1.3; padding-right: 30px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-name { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.tag { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line-soft); }
.tag.data { color: #e8c37a; border-color: rgba(224,166,58,0.35); background: rgba(224,166,58,0.08); }
.tag.warn { color: #ffd27a; border-color: rgba(250,178,25,0.4); background: rgba(250,178,25,0.08); }
.reasons { margin: 9px 0 0; padding: 0; list-style: none; font-size: 12.5px; color: var(--ink-2); }
.reasons li { position: relative; padding-left: 13px; margin-top: 3px; }
.reasons li::before { content: ""; position: absolute; left: 2px; top: 8px; width: 4px; height: 4px; border-radius: 50%; background: var(--muted); }
.check {
  position: absolute; top: 14px; right: 14px;
  width: 22px; height: 22px; border-radius: 7px;
  border: 1.5px solid #4a5157; background: var(--bg);
  display: grid; place-items: center; transition: all 0.15s;
}
.card.sel .check { background: var(--accent); border-color: var(--accent); }
.check svg { opacity: 0; transform: scale(0.6); transition: all 0.15s; }
.card.sel .check svg { opacity: 1; transform: none; }
.lock { position: absolute; top: 14px; right: 14px; color: var(--muted); }
.compact .card { grid-template-columns: 44px 1fr; padding: 10px 12px; gap: 12px; }
.compact .ico { width: 44px; height: 44px; border-radius: 10px; font-size: 15px; }
.compact .reasons { margin-top: 5px; }

.empty { text-align: center; padding: 80px 20px; color: var(--muted); }
.empty h3 { color: var(--ink); font-family: var(--font-display); font-size: 22px; margin: 14px 0 6px; }

.skel { background: linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%); background-size: 200% 100%; animation: shimmer 1.3s infinite; border-radius: var(--radius); }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

.actionbar {
  position: fixed; left: 300px; right: 0; bottom: 0; z-index: 20;
  display: flex; justify-content: center; padding: 0 24px 22px;
  pointer-events: none;
  transform: translateY(120%); transition: transform 0.3s cubic-bezier(.2,.8,.2,1);
}
.actionbar.show { transform: none; }
.actionbar-inner {
  pointer-events: auto;
  display: flex; align-items: center; gap: 18px;
  background: rgba(30, 33, 37, 0.92); backdrop-filter: blur(18px);
  border: 1px solid #3a4046; border-radius: 16px;
  padding: 12px 12px 12px 22px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.55);
}
.actionbar .info b { font-size: 15px; }
.actionbar .info span { color: var(--ink-2); font-size: 13px; margin-left: 8px; }
.actionbar .hint { color: #ffd27a; font-size: 12.5px; }

.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(5,6,7,0.6); backdrop-filter: blur(4px); display: none; }
.overlay.show { display: block; animation: fade 0.2s; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal {
  position: fixed; z-index: 41; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: min(560px, 92vw); max-height: 82vh; display: none; flex-direction: column;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
}
.modal.show { display: flex; animation: pop 0.22s cubic-bezier(.2,.8,.2,1); }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -47%) scale(0.98); } to { opacity: 1; transform: translate(-50%, -50%); } }
.modal-head { padding: 22px 24px 8px; }
.modal-head h3 { margin: 0; font-family: var(--font-display); font-size: 21px; }
.modal-head p { margin: 8px 0 0; color: var(--ink-2); }
.modal-list { overflow-y: auto; padding: 8px 24px; display: flex; flex-direction: column; gap: 6px; }
.mini { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; background: var(--surface-2); }
.mini .ico { width: 30px; height: 30px; border-radius: 7px; font-size: 12px; }
.mini .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
.mini .sz { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 24px 20px; border-top: 1px solid var(--line-soft); margin-top: 8px; }

.drawer {
  position: fixed; z-index: 41; top: 0; right: 0; bottom: 0; width: min(440px, 94vw);
  background: var(--surface); border-left: 1px solid var(--line);
  box-shadow: -30px 0 80px rgba(0,0,0,0.5);
  transform: translateX(105%); transition: transform 0.28s cubic-bezier(.2,.8,.2,1);
  display: flex; flex-direction: column;
}
.drawer.show { transform: none; }
.drawer-head { display: flex; justify-content: space-between; align-items: center; padding: 22px 22px 14px; border-bottom: 1px solid var(--line-soft); }
.drawer-head h3 { margin: 0; font-family: var(--font-display); font-size: 20px; }
.drawer-body { overflow-y: auto; padding: 16px 22px 30px; }
.hist { margin-bottom: 22px; display: flex; flex-direction: column; gap: 6px; }
.hist-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.hist-head span { color: var(--ink-2); font-size: 12.5px; }
.mini .restored { font-size: 11.5px; color: var(--muted); }
.mini button { padding: 0 10px; height: 28px; font-size: 12px; }

.toast {
  position: fixed; z-index: 60; left: 50%; bottom: 28px; transform: translate(-50%, 160%);
  background: #0b0c0d; border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 18px; display: flex; gap: 10px; align-items: center;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5); transition: transform 0.3s cubic-bezier(.2,.8,.2,1);
}
.toast.show { transform: translate(-50%, 0); }
.toast.err { border-color: rgba(208,59,59,0.6); }

.lost { position: fixed; inset: 0; z-index: 70; display: none; place-items: center; background: rgba(5,6,7,0.85); backdrop-filter: blur(6px); text-align: center; }
.lost.show { display: grid; }
.lost h3 { font-family: var(--font-display); font-size: 22px; margin: 0 0 6px; }
.lost p { color: var(--ink-2); margin: 0; }

.folder {
  margin-top: 22px;
  display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center;
  padding: 20px 22px; border-radius: 16px;
  background: linear-gradient(135deg, #1d2125, #191c1f);
  border: 1px solid var(--line);
}
.folder-head { display: flex; align-items: center; gap: 12px; }
.folder-ico { width: 40px; height: 40px; border-radius: 11px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex-shrink: 0; }
.folder h3 { margin: 0; font-family: var(--font-display); font-size: 17px; font-weight: 650; }
.folder-path { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-top: 2px; word-break: break-all; }
.folder .bar { height: 10px; margin-top: 16px; }
.folder .legend { margin-top: 10px; }
.folder-side { text-align: right; }
.folder-side .big { font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1; letter-spacing: -0.6px; font-variant-numeric: tabular-nums; }
.folder-side .small { color: var(--ink-2); font-size: 12.5px; margin: 4px 0 12px; }
.folder-done { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; }
.share { margin-top: 10px; font-size: 12.5px; color: #ffd27a; display: flex; gap: 8px; align-items: center; }

.choice { padding: 6px 24px 4px; display: flex; flex-direction: column; gap: 8px; }
.choice-label { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-top: 6px; }
.opt {
  display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start;
  padding: 11px 13px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface-2); cursor: pointer; transition: all 0.15s;
}
.opt:hover { border-color: #3c434a; }
.opt.on { border-color: var(--accent); background: linear-gradient(180deg, rgba(224,166,58,0.10), rgba(224,166,58,0.04)); }
.opt input { display: none; }
.radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #4a5157; margin-top: 1px; display: grid; place-items: center; }
.opt.on .radio { border-color: var(--accent); }
.opt.on .radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.opt b { display: block; font-size: 13.5px; }
.opt span { font-size: 12.5px; color: var(--ink-2); }
.opt code { font-family: var(--mono); font-size: 11px; color: var(--muted); word-break: break-all; }
.note { margin: 2px 24px 0; padding: 10px 12px; border-radius: 10px; background: rgba(57,135,229,0.08); border: 1px solid rgba(57,135,229,0.3); font-size: 12.5px; color: var(--ink-2); }
.modal.wide { width: min(760px, 94vw); }
.listhead { display: flex; justify-content: space-between; align-items: center; padding: 10px 24px 4px; font-size: 12.5px; color: var(--ink-2); }
.listhead button { background: none; border: 0; color: var(--accent); cursor: pointer; font-weight: 600; font-size: 12.5px; padding: 0; }
.mini.pickrow { cursor: pointer; border: 1px solid transparent; }
.mini.pickrow:hover { border-color: #3c434a; }
.mini .cb { width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid #4a5157; display: grid; place-items: center; flex-shrink: 0; }
.mini.on .cb { background: var(--accent); border-color: var(--accent); }
.mini .cb svg { opacity: 0; }
.mini.on .cb svg { opacity: 1; }
.kind { font-size: 11px; padding: 1px 7px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.kind.copy { color: #ffd27a; border-color: rgba(250,178,25,0.4); }
.hist-title { font-weight: 600; font-size: 13.5px; }

@media (max-width: 980px) {
  .folder { grid-template-columns: 1fr; }
  .folder-side { text-align: left; }
  body { grid-template-columns: 1fr; overflow: auto; }
  .rail { display: none; }
  .hero, .content, .toolbar { padding-left: 16px; padding-right: 16px; }
  .hero-inner { grid-template-columns: 1fr; }
  .hero-stat { text-align: left; }
  .actionbar { left: 0; }
  .search { width: 100%; }
}
</style>
</head>

<aside class="rail">

    <div style="position:relative;z-index:1" id="folderPanel"></div>

  <div class="toolbar" id="toolbar">

      <span data-i18n="history"></span> <span class="badge" id="histCount" hidden></span>

  </div>

  <div class="content" id="content"></div>
</div>

<div class="actionbar" id="actionbar">
  <div class="actionbar-inner">
    <div class="info"><b id="selCount"></b><span id="selSize"></span></div>

    <button class="btn ghost" id="selClear" data-i18n="clearSel"></button>
    <button class="btn primary" id="selApply">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      <span data-i18n="disableBtn"></span>
    </button>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="modal" id="modal">

    <button class="btn ghost" id="modalCancel" data-i18n="cancel"></button>
    <button class="btn primary" id="modalOk" data-i18n="disable"></button>
  </div>
</div>
<div class="modal wide" id="fmodal">

  <div class="listhead" id="fListHead"></div>
  <div class="modal-list" id="fList"></div>
  <div class="modal-foot">
    <button class="btn ghost" id="fCancel" data-i18n="cancel"></button>
    <button class="btn primary" id="fOk" data-i18n="folderOkDefault"></button>
  </div>
</div>

<aside class="drawer" id="drawer">

</aside>

const LOCALES = { de: "de-DE", en: "en-GB", fr: "fr-FR" };
const UNITS = { de: ["MB", "GB"], en: ["MB", "GB"], fr: ["Mo", "Go"] };
let LANG = "de";

function t(key, vars) {
  const s = (I18N[LANG] && I18N[LANG][key]) || I18N.de[key] || key;
  return vars ? s.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m)) : s;
}

const ENGINE_PATTERNS = [
  [/^immer gesperrt, fuehrt Bodenkarten fuer alle Felder im Spielstand$/, "rLocked"],
  [/^Karte dieses Spielstands$/, "rMap"],
  [/^(\d+) in (\S+\.xml): (.*)$/, "rPlaced", m => ({ n: m[1], file: m[2], labels: m[3] })],
  [/^(\d+) Verweise in Fahrzeug\/Objektdaten$/, "rRefs", m => ({ n: m[1] })],
  [/^Fuelltyp (\S+) mit (\d+) l Bestand \((.*)\)$/, "rFill", m => ({ ft: m[1], l: fmt(m[2]), files: m[3] })],
  [/^benoetigt von (.+)$/, "rNeededBy", m => ({ x: m[1] })],
  [/^offizieller DLC, wird vom Spiel selbst verwaltet$/, "rDlc"],
  [/^modDesc\.xml nicht lesbar$/, "rModDescBad"],
  [/^nicht im Kartenordner und nicht in der Bibliothek gefunden$/, "rNotFound"],
  [/^(\d+) Shop-Artikel ungenutzt, aber die Scripts des Mods haben Daten im Spielstand$/, "rMixedData", m => ({ n: m[1] })],
  [/^eigene Daten im Spielstand: (.*)$/, "rOwnData", m => ({ x: m[1] })],
  [/^Daten an Fahrzeugen\/Objekten: (.*)$/, "rElemData", m => ({ x: m[1] })],
  [/^\d+ Shop-Artikel, keiner davon im Spielstand$/, "rNothingBought"],
  [/^hat gerade ein Angebot im Gebrauchtmarkt, das beim Deaktivieren verschwindet$/, "rUsedMarket"],
  [/^braucht (.+), im Spielstand aber nicht aktiv$/, "wMissingDeps", m => ({ x: m[1] })],
  [/^im Spielstand benutzt, aber nicht aktiv: Objekte gehen beim naechsten Speichern verloren$/, "wUsedNotActive"],
  [/^im Spielstand benutzt, aber Mod-Datei fehlt: Objekte gehen beim naechsten Speichern verloren$/, "wUsedMissing"],
  [/^im Spielstand benutzt, liegt aber nicht im Mods-Ordner dieses Spielstands$/, "wUsedNotInFolder"],
  [/^Das Spiel laeuft noch\./, "gameStillRunning"],
  [/^Diese Mods werden im Spielstand benutzt oder sind gesperrt und werden nicht deaktiviert: (.*)$/, "eBlockedUsed", m => ({ x: m[1] })],
  [/^Diese Mods werden von aktiv bleibenden Mods als Abhaengigkeit gebraucht: (.*)$/, "eBlockedDeps", m => ({ x: m[1] })],
  [/^Spielstand nicht lesbar: (.*)$/, "eSgUnreadable", m => ({ x: m[1] })],
  [/^Im Archiv liegt schon (?:eine Datei|ein Ordner) mit diesem Namen: (.*)$/, "eArchiveExists", m => ({ x: m[1] })],
  [/^Quelle nicht mehr vorhanden: (.*)$/, "eSourceGone", m => ({ x: m[1] })],
  [/^Dieser Spielstand gehoert zu einem anderen Mods-Ordner/, "eMismatch"]
];
function tEngine(text) {
  const s = String(text ?? "");
  for (const [re, key, fn] of ENGINE_PATTERNS) {
    const m = s.match(re);
    if (m) return t(key, fn ? fn(m) : null);
  }
  return s;
}

async function api(path, body) {
  const opt = { headers: { "X-Token": token } };
  if (body) { opt.method = "POST"; opt.body = JSON.stringify(body); opt.headers["Content-Type"] = "application/json"; }
  const r = await fetch(path, opt);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(tEngine(data.error) || t("errorN", { n: r.status }));
  return data;
}

function iconHtml(name, title, has, sg) {
  if (!has) return `<div class="ico">${mono(title || name)}</div>`;
  return `<div class="ico"><img loading="lazy" src="${iconUrl(name, sg)}" alt="" onerror="this.parentNode.textContent='${mono(title || name)}'"></div>`;
}

function toast(msg, err) {
  const el = $("toast");
  el.className = "toast" + (err ? " err" : "");
  el.innerHTML = (err
    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d03b3b" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0ca30c" stroke-width="2.4" stroke-linecap="round"><path d="m5 12 5 5 9-10"/></svg>') + `<span>${esc(msg)}</span>`;
  requestAnimationFrame(() => el.classList.add("show"));
  clearTimeout(toast.h);
  toast.h = setTimeout(() => el.classList.remove("show"), 4200);
}

  }

  const active = u.Mods.filter(m => m.Active);

  $("compo").innerHTML = `

  $("compo").querySelectorAll(".seg").forEach(s => {
    const x = counts.find(c => c.g.key === s.dataset.g);

  if (m.Status === "Script" && m.Reasons.some(r => r.startsWith("eigene Daten") || r.startsWith("Daten an"))) tags.push(`<span class="tag data">${t("tagData")}</span>`);
  if (m.Status === "Unbenutzt" && m.HasScripts) tags.push(`<span class="tag warn">${t("tagScripts")}</span>`);
  if (!m.Active) tags.push(`<span class="tag warn">${t("tagInactive")}</span>`);
  const reasons = m.Reasons.filter(r => !r.startsWith("enthaelt zusaetzlich") && !r.startsWith("keine eigenen Daten"));
  return `<div class="card${canPick ? " pick" : ""}${sel ? " sel" : ""}" data-n="${esc(m.Name)}">
    <span class="stripe" style="background:${g.color}"></span>
    ${iconHtml(m.Name, m.Title, m.HasIcon, state.usage.Id)}
    <div class="card-body">
      <div class="card-title" title="${esc(m.Title)}">${esc(m.Title)}</div>
      <div class="card-name">${esc(m.Name)}${m.Author ? " · " + esc(m.Author) : ""}</div>
      ${tags.length ? `<div class="tags">${tags.join("")}</div>` : ""}
      ${reasons.length ? `<ul class="reasons">${reasons.map(r => `<li>${esc(tEngine(r))}</li>`).join("")}</ul>` : ""}
    </div>
    ${canPick
      ? `<span class="check"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1a1204" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></span>`
      : `<span class="lock" title="${t("protected")}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>`}
  </div>`;
}

function renderGroups() {
  const u = state.usage;
  const q = state.query.trim().toLowerCase();
  const warn = u.Mods.filter(m => m.Warning);
  let html = "";
  if (u.GameRunning) html += `<div class="alert warn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fab219" stroke-width="2" stroke-linecap="round"><path d="M12 3 2 21h20L12 3zM12 10v5M12 18h.01"/></svg><div><strong>${t("gameRunTitle")}</strong>${t("gameRunText")}</div></div>`;
  if (u.FolderMismatch) html += `<div class="alert info"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3987e5" stroke-width="2" stroke-linecap="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><div><strong>${t("mismatchTitle")}</strong>${t("mismatchText", { folder: `<code>${esc(u.ModsFolder || "")}</code>` })}</div></div>`;
  const unknown = u.FolderMismatch ? [] : u.Mods.filter(m => m.Status === "Unbekannt" && m.Active);
  if (unknown.length >= 5 && unknown.length >= u.Mods.filter(m => m.Active).length / 4) html += `<div class="alert warn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fab219" stroke-width="2" stroke-linecap="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><div><strong>${t("unknownTitle", { n: fmt(unknown.length) })}</strong>${t("unknownText")}</div></div>`;
  if (warn.length) html += `<div class="alert"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d03b3b" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><div><strong>${warn.length === 1 ? t("warnTitle1") : t("warnTitleN", { n: fmt(warn.length) })}</strong>${t("warnText")}<ul>${warn.map(m => `<li><b>${esc(m.Title)}</b>: ${esc(tEngine(m.Warning))}</li>`).join("")}</ul></div></div>`;

  let any = false;
  for (const g of GROUPS) {
    if (state.filter !== "all" && state.filter !== g.key) continue;
    let mods = u.Mods.filter(m => groupOf(m.Status) === g);
    if (q) mods = mods.filter(m => (m.Title + " " + m.Name + " " + (m.Author || "")).toLowerCase().includes(q));
    if (!mods.length) continue;
    any = true;
    mods.sort((a, b) => g.key === "Unbenutzt" ? (b.SizeMB-a.SizeMB) : a.Title.localeCompare(b.Title, LANG));
    const pickIds = mods.filter(pickable).map(m => m.Name);
    const allSel = pickIds.length && pickIds.every(n => state.selected.has(n));
    const compact = !g.pick;
    html += `<section class="group${compact ? " compact" : ""}">
      <div class="group-head">
        <div>
          <div class="group-title"><span class="sw" style="background:${g.color}"></span><h3>${t(g.label)}</h3><span class="count">${fmt(mods.length)}</span></div>
          <p class="group-desc">${t(g.desc)}</p>
        </div>
        ${pickIds.length > 1 ? `<div class="group-actions"><button class="btn" data-all="${g.key}">${allSel ? t("selectNone") : t("selectAll")}</button></div>` : ""}
      </div>
      <div class="grid">${mods.map(m => cardHtml(m, g)).join("")}</div>
    </section>`;
  }
  if (!any) html += `<div class="empty"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><h3>${t("emptyTitle")}</h3><p>${t("emptyText")}</p></div>`;
  $("content").innerHTML = html;

  document.querySelectorAll(".card.pick").forEach(c => c.onclick = () => {
    const n = c.dataset.n;
    state.selected.has(n) ? state.selected.delete(n) : state.selected.add(n);
    c.classList.toggle("sel", state.selected.has(n));
    renderActionbar();
    refreshGroupButtons();
  });
  document.querySelectorAll("[data-all]").forEach(b => b.onclick = () => {
    const cards = [...b.closest(".group").querySelectorAll(".card.pick")];
    const all = cards.every(c => state.selected.has(c.dataset.n));
    cards.forEach(c => { all ? state.selected.delete(c.dataset.n) : state.selected.add(c.dataset.n); c.classList.toggle("sel", !all); });
    refreshGroupButtons();
    renderActionbar();
  });
}

function refreshGroupButtons() {
  document.querySelectorAll("[data-all]").forEach(b => {
    const cards = [...b.closest(".group").querySelectorAll(".card.pick")];
    b.textContent = cards.length && cards.every(c => state.selected.has(c.dataset.n)) ? t("selectNone") : t("selectAll");
  });
}

function renderActionbar() {
  const n = state.selected.size;
  const mods = state.usage ? state.usage.Mods.filter(m => state.selected.has(m.Name)) : [];
  const mb = mods.reduce((a, m) => a + (m.SizeMB || 0), 0);
  $("actionbar").classList.toggle("show", n > 0);
  $("selCount").textContent = n === 1 ? t("sel1") : t("selN", { n: fmt(n) });
  $("selSize").textContent = mb ? fmtSize(mb) : "";
  $("selHint").hidden = !state.gameRunning;
  $("selApply").disabled = state.gameRunning;
}

function optHtml(group, value, current, title, text) {
  return `<label class="opt${current === value ? " on" : ""}" data-group="${group}" data-value="${value}"><input type="radio"><span class="radio"></span><div><b>${title}</b><span>${text}</span></div></label>`;
}
function bindOpts(container, onChange) {
  container.querySelectorAll(".opt").forEach(o => o.onclick = () => {
    container.querySelectorAll(`.opt[data-group="${o.dataset.group}"]`).forEach(x => x.classList.toggle("on", x === o));
    onChange(o.dataset.group, o.dataset.value);
  });
}

function openModal() {
  const mods = state.usage.Mods.filter(m => state.selected.has(m.Name));
  const scripts = mods.filter(m => m.Status === "Script").length;
  $("modalTitle").textContent = mods.length === 1 ? t("modalTitle1") : t("modalTitleN", { n: fmt(mods.length) });
  $("modalText").innerHTML = esc(t("modalText")) + (scripts ? `<br><br><b style="color:#ffd27a">${esc(t("modalScriptsHead", { n: fmt(scripts) }))}</b>${esc(t("modalScriptsText"))}` : "");
  const archive = state.folder ? state.folder.ArchiveFolder : "";
  const shared = state.folder && state.folder.Sharing.length > 1;
  $("modalChoice").innerHTML = `<div class="choice-label">${t("choiceFiles")}</div>`
    + optHtml("file", "remove", state.fileAction, t("optRemoveTitle"),
      t("optRemoveText", { archive: archive ? `: <code>${esc(archive)}</code>` : "", shared: shared ? t("optShared") : "" }))
    + optHtml("file", "keep", state.fileAction, t("optKeepTitle"), t("optKeepText"));
  bindOpts($("modalChoice"), (g, v) => { state.fileAction = v; });
  $("modalList").innerHTML = mods.map(m => `<div class="mini">${iconHtml(m.Name, m.Title, m.HasIcon, state.usage.Id)}<span class="nm">${esc(m.Title)}</span><span class="sz">${m.SizeMB ? fmtSize(m.SizeMB) : ""}</span></div>`).join("");
  $("overlay").classList.add("show");
  $("modal").classList.add("show");
}
function closeModal() { $("modal").classList.remove("show"); $("fmodal").classList.remove("show"); if (!$("drawer").classList.contains("show")) $("overlay").classList.remove("show"); }

async function applyDisable() {
  const mods = [...state.selected];
  $("modalOk").disabled = true;
  try {
    const sg = state.usage.Id;
    const r = await api("/api/disable", { sg, mods });
    let msg = t("toastDisabled", { n: fmt(r.changed.length) });
    if (state.fileAction === "remove" && r.changed.length) {
      const c = await api("/api/folder/clean", { sg, mods: r.changed, copyAction: "Move" });
      const kept = r.changed.length-c.removed.length;
      msg += t("toastDisabledFolder", { n: fmt(c.removed.length) }) + (kept ? t("toastKept", { n: fmt(kept) }) : "");
    }
    closeModal();
    state.selected.clear();
    toast(msg);
    await loadUsage(sg, true);
  } catch (e) {
    toast(e.message, true);
  } finally {
    $("modalOk").disabled = false;
  }
}

function renderDrawer() {
  const u = state.usage;
  const hist = [...u.History].reverse();
  if (!hist.length) {
    $("drawerBody").innerHTML = `<div class="empty" style="padding:60px 10px"><h3>${t("histEmptyTitle")}</h3><p>${t("histEmptyText")}</p></div>`;
    return;
  }
  const titles = { Both: "histBoth", Savegame: "histSg", Folder: "histFolder" };
  $("drawerBody").innerHTML = hist.map(h => {
    const open = h.Mods.filter(m => !m.Restored).map(m => m.Name);
    const d = new Date(h.Date.replace(" ", "T"));
    return `<div class="hist">
      <div class="hist-head"><div><div class="hist-title">${t(titles[h.Kind] || "histSg")}</div><span>${d.toLocaleString(LOCALES[LANG], { dateStyle: "medium", timeStyle: "short" })} · ${tn("modsN", h.Mods.length)}</span></div>
      ${open.length > 1 ? `<button class="btn" style="height:30px;font-size:12px" data-date="${esc(h.Date)}" data-restore='${esc(JSON.stringify(open))}'>${t("restoreAll")}</button>` : ""}</div>
      ${h.Mods.map(m => `<div class="mini">${iconHtml(m.Name, m.Name, true, u.Id)}<span class="nm">${esc(m.Name)}</span>${m.Restored ? `<span class="restored">${t("undone")}</span>` : `<button class="btn" data-date="${esc(h.Date)}" data-restore='${esc(JSON.stringify([m.Name]))}'>${t("restore")}</button>`}</div>`).join("")}
    </div>`;
  }).join("");
  document.querySelectorAll("[data-restore]").forEach(b => b.onclick = async () => {
    if (state.gameRunning) { toast(t("gameStillRunning"), true); return; }
    b.disabled = true;
    try {
      const r = await api("/api/undo", { sg: u.Id, date: b.dataset.date, mods: JSON.parse(b.dataset.restore) });
      const failed = r.failed && r.failed.length ? r.failed.length : 0;
      toast(t("toastUndone", { n: fmt(r.changed.length) }) + (failed ? t("failedN", { n: fmt(failed) }) : ""), failed > 0);
      await loadUsage(u.Id, true);
      renderDrawer();
    } catch (e) { toast(e.message, true); b.disabled = false; }
  });
}

async function loadUsage(id, keepScroll) {
  const top = $("main").scrollTop;
  if (!keepScroll) renderLoading();
  try {
    const u = await api(`/api/usage?sg=${encodeURIComponent(id)}`);
    if (state.sg !== id) return;
    state.usage = u;
    state.gameRunning = u.GameRunning;
    const s = state.savegames.find(x => x.Id === id);
    if (s) { s.ActiveMods = u.Mods.filter(m => m.Active).length; renderSavegames(); }
    renderHero();
    renderChips();
    renderGroups();
    renderActionbar();
    if (keepScroll) $("main").scrollTop = top;
    if (u.FolderMismatch) $("folderPanel").innerHTML = ""; else loadFolder(id);
  } catch (e) {
    $("content").innerHTML = `<div class="empty"><h3>${t("loadErrTitle")}</h3><p>${esc(e.message)}</p></div>`;
  }
}

async function loadFolder(id) {
  if (!state.folder || state.folder.id !== id) $("folderPanel").innerHTML = `<div class="skel" style="height:118px;margin-top:22px;border-radius:16px"></div>`;
  try {
    const f = await api(`/api/folder?sg=${encodeURIComponent(id)}`);
    if (state.sg !== id) return;
    f.id = id;
    state.folder = f;
    renderFolderPanel();
  } catch (e) {
    $("folderPanel").innerHTML = "";
    toast(t("folderErr") + e.message, true);
  }
}

function renderFolderPanel() {
  const f = state.folder;
  const n = f.Candidates.length;
  const mb = f.Candidates.reduce((a, c) => a + (c.SizeMB || 0), 0);
  const others = f.Sharing.filter(s => s.Id !== state.sg);
  const kindText = f.FolderKind === "Karte" ? t("kindKarte") : t("kindGame");
  const segs = [
    { label: t("segUsed"), n: f.KeptCount, mb: f.KeptMB, color: "var(--s-used)" },
    { label: t("segUnused"), n, mb, color: "var(--s-unused)" }
  ].filter(s => s.n);
  $("folderPanel").innerHTML = `<div class="folder">
    <div>
      <div class="folder-head">
        <div class="folder-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div>
        <div style="min-width:0"><h3>${t("folderHead", { n: fmt(f.TotalCount), s: fmtSize(f.TotalMB) })}</h3><div class="folder-path">${esc(kindText)} · ${esc(f.Folder)}</div></div>
      </div>
      <div class="bar">${segs.map((s, i) => `<div class="seg" style="flex:${s.n};background:${s.color};animation-delay:${i * 60}ms;cursor:default"></div>`).join("")}</div>
      <div class="legend">${segs.map(s => `<button style="cursor:default"><span class="sw" style="background:${s.color}"></span>${s.label} <b>${fmt(s.n)}</b> · ${fmtSize(s.mb)}</button>`).join("")}</div>
      ${others.length ? `<div class="share"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="10" r="2.5"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M14 20c0-2 1.5-4 4-4 1.5 0 3 1 3 3"/></svg>${t("sharedBy", { names: others.map(o => esc(o.Name || o.Id)).join(", ") })}</div>` : ""}
    </div>
    <div class="folder-side">
      ${n ? `<div class="big">${fmtSize(mb)}</div><div class="small">${t("folderSmall", { n: fmt(n) })}</div>
      <button class="btn primary" id="folderBtn" ${state.gameRunning ? "disabled" : ""}>${t("folderBtn")}</button>`
      : `<div class="folder-done"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0ca30c" stroke-width="2.4" stroke-linecap="round"><path d="m5 12 5 5 9-10"/></svg>${t("folderDone")}</div>`}
    </div>
  </div>`;
  if ($("folderBtn")) $("folderBtn").onclick = openFolderModal;
}

async function openFolderModal() {
  $("fTitle").textContent = t("folderTitle");
  $("fText").textContent = t("readingMods");
  $("fChoice").innerHTML = "";
  $("fListHead").innerHTML = "";
  $("fList").innerHTML = Array.from({ length: 6 }, () => '<div class="skel" style="height:42px;border-radius:10px"></div>').join("");
  $("fOk").disabled = true;
  $("overlay").classList.add("show");
  $("fmodal").classList.add("show");
  try {
    const d = await api(`/api/folder?sg=${encodeURIComponent(state.sg)}&detail=1`);
    state.folderDetail = d;
    state.folderPick = new Set(d.Candidates.map(c => c.Name));
    renderFolderModal();
  } catch (e) { closeModal(); toast(e.message, true); }
}

function renderFolderModal() {
  const d = state.folderDetail;
  const links = d.Candidates.filter(c => c.Kind !== "Kopie").length;
  const copies = d.Candidates.filter(c => c.Kind === "Kopie").length;
  const parts = [];
  if (links) parts.push(t("fLinks", { n: fmt(links) }));
  if (copies) parts.push(t("fCopies", { n: fmt(copies) }));
  $("fText").innerHTML = `${esc(t("fText"))} ${parts.join(" ")}`;
  let choice = "";
  if (copies) {
    choice += `<div class="choice-label">${t("realFiles")}</div>`
      + optHtml("copy", "Move", state.copyAction, t("optMoveTitle"), t("optMoveText", { path: `<code>${esc(d.ArchiveFolder)}</code>` }))
      + optHtml("copy", "Keep", state.copyAction, t("optLeaveTitle"), t("optLeaveText"));
  }
  $("fChoice").innerHTML = choice + (d.FolderKind === "Karte" && !d.Scoped ? `<div class="note" style="margin:6px 0 0">${t("scopedNote")}</div>` : "");
  bindOpts($("fChoice"), (g, v) => { state.copyAction = v; updateFolderFoot(); });
  $("fList").innerHTML = d.Candidates.map(c => `<div class="mini pickrow${state.folderPick.has(c.Name) ? " on" : ""}" data-n="${esc(c.Name)}">
      <span class="cb">${CHECK_SVG}</span>${iconHtml(c.Name, c.Title, c.HasIcon, state.sg)}
      <span class="nm" title="${esc(c.Name)}">${esc(c.Title)}</span>
      <span class="kind${c.Kind === "Kopie" ? " copy" : ""}">${kindLabel(c.Kind)}</span>
      <span class="sz">${c.SizeMB ? fmtSize(c.SizeMB) : ""}</span></div>`).join("");
  $("fList").querySelectorAll(".pickrow").forEach(r => r.onclick = () => {
    const n = r.dataset.n;
    state.folderPick.has(n) ? state.folderPick.delete(n) : state.folderPick.add(n);
    r.classList.toggle("on", state.folderPick.has(n));
    updateFolderFoot();
  });
  updateFolderFoot();
}

function updateFolderFoot() {
  const d = state.folderDetail;
  const picked = d.Candidates.filter(c => state.folderPick.has(c.Name));
  const effective = picked.filter(c => c.Kind !== "Kopie" || state.copyAction === "Move");
  const mb = effective.reduce((a, c) => a + (c.SizeMB || 0), 0);
  const all = picked.length === d.Candidates.length;
  $("fListHead").innerHTML = `<span>${t("pickedOf", { a: fmt(picked.length), b: fmt(d.Candidates.length) })}</span><button id="fAll">${all ? t("selectNone") : t("selectAll")}</button>`;
  $("fAll").onclick = () => { state.folderPick = all ? new Set() : new Set(d.Candidates.map(c => c.Name)); renderFolderModal(); };
  $("fOk").disabled = !effective.length || state.gameRunning;
  $("fOk").textContent = effective.length ? t("fOkN", { n: fmt(effective.length), s: fmtSize(mb) }) : t("nothing");
}

async function applyFolderClean() {
  const mods = [...state.folderPick];
  $("fOk").disabled = true;
  try {
    const r = await api("/api/folder/clean", { sg: state.sg, mods, copyAction: state.copyAction });
    closeModal();
    const skipped = r.skipped.filter(s => !s.Reason.startsWith("echte Kopie"));
    toast(t("toastFolderClean", { n: fmt(r.removed.length) }) + (skipped.length ? t("skippedN", { n: fmt(skipped.length) }) : ""), skipped.length > 0 && !r.removed.length);
    await loadUsage(state.sg, true);
  } catch (e) { toast(e.message, true); $("fOk").disabled = false; }
}

function selectSavegame(id) {
  if (state.sg === id) return;
  state.sg = id;
  state.selected.clear();
  state.filter = "all";
  state.usage = null;
  state.folder = null;
  state.folderDetail = null;
  $("search").value = "";
  state.query = "";
  renderSavegames();
  renderActionbar();
  $("main").scrollTop = 0;
  loadUsage(id);
}

$("search").oninput = e => { state.query = e.target.value; if (state.usage) renderGroups(); };
$("selClear").onclick = () => { state.selected.clear(); renderGroups(); renderActionbar(); };
$("selApply").onclick = openModal;
$("modalCancel").onclick = closeModal;
$("modalOk").onclick = applyDisable;
$("fCancel").onclick = closeModal;
$("fOk").onclick = applyFolderClean;
$("histBtn").onclick = () => { if (!state.usage) return; renderDrawer(); $("overlay").classList.add("show"); $("drawer").classList.add("show"); };
$("drawerClose").onclick = () => { $("drawer").classList.remove("show"); $("overlay").classList.remove("show"); };
$("overlay").onclick = () => { closeModal(); $("drawer").classList.remove("show"); $("overlay").classList.remove("show"); };
document.addEventListener("keydown", e => { if (e.key === "Escape") $("overlay").onclick(); });

$("updGo").onclick = async () => {
  if (state.updating) return;
  state.updating = true;
  $("updGo").disabled = true;
  toast(t("updLoading"));
  try {
    await api("/api/update", {});
    setTimeout(() => window.close(), 800);
  } catch (e) {
    state.updating = false;
    $("updGo").disabled = false;
    toast(t("updFailed", { a: e.message === "updateHash" ? t("updHash") : e.message }), true);
  }
};

async function ping() {
  try {
    const r = await api("/api/ping");
    if (r.gameRunning !== state.gameRunning) {
      state.gameRunning = r.gameRunning;
      if (state.usage) { state.usage.GameRunning = r.gameRunning; renderGroups(); renderActionbar(); }
      if (state.folder) renderFolderPanel();
      if (state.folderDetail && $("fmodal").classList.contains("show")) updateFolderFoot();
    }
    $("lost").classList.remove("show");
    ping.failed = 0;
    $("updBox").hidden = !r.update;
    if (r.update) $("updText").textContent = t("updText", { v: r.update, c: r.version });
    return r;
  } catch {
    $("lost").classList.add("show");
    ping.failed = (ping.failed || 0) + 1;
    if (ping.failed >= 3 && !state.updating) window.close();
    return null;
  }
}

(async () => {
  const urlLang = new URLSearchParams(location.search).get("lang");
  const first = await ping();
  LANG = I18N[urlLang] ? urlLang : (first && I18N[first.lang] ? first.lang : "de");
  applyStaticTexts();
  renderLoading();
  setInterval(ping, 4000);
  try {
    state.savegames = await api("/api/savegames");
    renderSavegames();
    const wanted = new URLSearchParams(location.search).get("sg");
    const pick = state.savegames.find(s => s.Id === wanted) || state.savegames[0];
    if (pick) selectSavegame(pick.Id);
  } catch (e) { toast(e.message, true); }
})();
</script>
</body>
</html>
